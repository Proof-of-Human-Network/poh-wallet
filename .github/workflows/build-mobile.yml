name: Build Mobile (Expo EAS)

# Android: EAS build → APK, attached to the Release for the pushed tag so the landing's
#   github.com/Proof-of-Human-Network/poh-wallet/releases/latest/download/poh-miner-wallet.apk
# link always serves the newest build (no manual uploads).
#
# iOS: EAS build. Requires an Apple Developer account (Program membership, $99/yr) —
# EAS manages the signing certs/profiles once you run `eas credentials`. NOTE: iOS apps
# cannot be side-loaded from a web link like an APK; distribution is TestFlight / App
# Store only, so there is NO downloadable release asset for iOS. This job is opt-in.
#
# REQUIRED repo secret:
#   EXPO_TOKEN  — Expo access token (expo.dev → Account settings → Access tokens)
# The workflow will fail fast with a clear message if it's missing.

on:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build iOS (requires Apple Developer account)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write            # release step uploads the APK

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions (from expo.dev → Account → Access tokens)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build Android (APK) and fetch artifact
        run: |
          set -e
          # Cloud build; wait for completion and emit JSON describing the build.
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          URL=$(node -e "const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b; const a=x.artifacts||{}; console.log(a.applicationArchiveUrl||a.buildUrl||'')")
          if [ -z "$URL" ]; then echo '::error::Could not read the APK URL from the EAS build output'; cat build.json; exit 1; fi
          echo "Artifact: $URL"
          curl -fL "$URL" -o poh-miner-wallet.apk
          ls -lh poh-miner-wallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: poh-wallet-android
          path: poh-miner-wallet.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: poh-miner-wallet.apk
          fail_on_unmatched_files: true

  ios:
    # Opt-in only (needs an Apple Developer account). Enable via the manual
    # "Run workflow" → "Also build iOS" toggle. iOS ships via TestFlight/App Store,
    # so there is no downloadable release asset produced here.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build iOS (TestFlight/App Store)
        # Requires Apple credentials configured once via `eas credentials`.
        run: eas build --platform ios --profile production --non-interactive --wait
      # To auto-submit to TestFlight after a successful build, add a repo secret set
      # and uncomment:
      # - run: eas submit --platform ios --latest --non-interactive
